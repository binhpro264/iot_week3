[env]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
upload_speed = 921600
lib_deps =
    mathertel/OneButton @ ^2.6.1
build_flags =
    -DBOARD_HAS_PSRAM
    -Ilib

[env:two_leds]
build_src_filter = -<*> +<twoLeds.cpp>
build_flags =
    ${env.build_flags}
    -DLED_PIN_1=4
    -DLED_PIN_2=6
    -DLED_ACT=HIGH
    -DBTN_PIN=5
    -DBTN_ACT=LOW

[env:blink]
build_src_filter = -<*> +<blink.cpp>
build_flags =
    ${env.build_flags}
    -DLED_PIN=4
    -DLED_ACT=HIGH

[env:double_push]
build_src_filter = -<*> +<doublePush.cpp>
build_flags =
    ${env.build_flags}
    -DLED_PIN=4
    -DLED_ACT=HIGH
    -DBTN_PIN=0
    -DBTN_ACT=LOW